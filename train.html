<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Biashara OS - New Sale</title>

    <link rel="stylesheet" href="css/style3.css">
</head>

<body>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">
            Biashara OS
        </div>

        <nav>
            <a class="active" href="#">Sell</a>
            <a href="#">Sales History</a>
            <a href="#">Products & Stock</a>
            <a href="#">Customers</a>
            <a href="#">Expenses</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOP BAR -->
        <header class="topbar">
            <input type="search"
                   placeholder="Search products by name or barcode...">

            <div class="user-profile">
                John Doe
            </div>
        </header>

        <!-- SALE WORKSPACE -->
        <section class="sale-workspace">

            <!-- PRODUCTS -->
            <div class="products-section">

                <div class="section-heading">
                    <div>
                        <h2>New Sale</h2>
                        <p>Tap a product to add it to cart</p>
                    </div>

                    <button>+ Quick Item</button>
                </div>

                <div class="categories">
                    <button>All</button>
                    <button>Drinks</button>
                    <button>Food</button>
                    <button>Household</button>
                    <button>Other</button>
                </div>

                <div class="product-grid">

                    <div class="product-card">
                        <img src="images/milk.png" alt="Milk">
                        <h4>Milk 500ml</h4>
                        <p>KES 65</p>
                        <button>+</button>
                    </div>

                    <div class="product-card">
                        <img src="images/bread.png" alt="Bread">
                        <h4>Bread</h4>
                        <p>KES 70</p>
                        <button>+</button>
                    </div>

                    <!-- Add the remaining products here -->

                </div>
            </div>

            <!-- CART -->
            <aside class="cart-section">

                <h3>Current Sale</h3>

                <div class="customer-select">
                    <select>
                        <option>Walk-in customer</option>
                    </select>
                </div>

                <div class="cart-items">
                    <!-- Your JavaScript will populate cart items -->
                </div>

                <div class="cart-summary">
                    <p>Subtotal: KES 0</p>
                    <h2>Total: KES 0</h2>

                    <button class="charge-btn">
                        CHARGE KES 0
                    </button>
                </div>

                <div class="payment-methods">
                    <button>M-Pesa</button>
                    <button>Card</button>
                    <button>Cash</button>
                </div>

            </aside>

        </section>
    </main>

</div>

<script src="js/app.js"></script>
</body>
</html>
