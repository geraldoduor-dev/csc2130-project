              <!--e customers products here using javascript-->

               <!--the customer cart-->

               <aside class="cart-section">
                     <h3>Adding a new product</h3>
<form id="newProduct" >

    <label for="purchaseDescription">Product</label>
    <input type="text" placeholder=" Example:" id="purchaseDescription" 
     name="purchaseDescription" class="inputstyle"></input>
      <br><br>
    <label for="quantityBought">Quantity</label>
    <input type="number" placeholder=" 1/one" id="quantityBought" name="quantityBought" 
     min="1" class="inputstyle">
    <br><br>
    <label for="buyPrice">Buying Price(KSH)</label>
    <input type="number" placeholder=" 0" id="buyPrice" name="buyPrice"
     min="1" step="0.01" class="inputstyle">
     <br><br>
     <label for="sellPrice">Selling price</label>
     <input type="number" placeholder="0" id="sellPrice" name="sellPrice"
     min="1" step="0.01" class="inputstyle">
<br>
<br>
                     <div class="customer-select">
                       <div class="cart-summary">
                        <P id="saleValue"></p>
                        <h2 id="profit"></h2>

                        <button class="charge-btn" type="submit">
                          You Paid KES 0
                        </button>
                       </div>
                     </div>

                      the charge button but for noe this will do-->
